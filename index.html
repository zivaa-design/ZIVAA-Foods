<div class="our-products">

    <h2>OUR PRODUCTS</h2>

    <!-- Scene: laddus + window + travelling laddu share one coordinate system -->
    <div class="laddu-scene" id="ladduScene">

        <!-- Five individual laddus (laddu 5 is the one that gets taken) -->
        <div class="laddu-row">
            <span class="laddu-item laddu-1"><img src="single-laddu.png" alt="Coconut laddu"></span>
            <span class="laddu-item laddu-2"><img src="single-laddu.png" alt="Coconut laddu"></span>
            <span class="laddu-item laddu-3"><img src="single-laddu.png" alt="Coconut laddu"></span>
            <span class="laddu-item laddu-4"><img src="single-laddu.png" alt="Coconut laddu"></span>
            <span class="laddu-item laddu-5"><img src="single-laddu.png" alt="Coconut laddu"></span>
        </div>

        <!-- Dialogue + Girl in window -->
        <div class="content-row">

            <div class="dialogue">

                <p class="bn">
                    দাদা একটা<br>
                    লাড্ডু নাও না...
                </p>

                <p class="hi">
                    भैया,<br>
                    एक लड्डू<br>
                    टेस्ट कीजिए! 😊
                </p>

            </div>

            <div class="animation-area">
                <img src="window-girl.png"
                     class="girl-window"
                     alt="Girl in a traditional wooden window">
            </div>

        </div>

        <!-- The same laddu that was taken from the row, travelling to her hand and then to you -->
        <img src="single-laddu.png"
             class="moving-laddu"
             alt=""
             aria-hidden="true">

    </div>

    <!-- Product Packet -->
    <div class="packet-area">

        <img src="zivaa-packet.png"
             class="packet"
             alt="ZIVAA Foods Coconut Laddu">

    </div>

</div>

<script>

const track = document.getElementById("sliderTrack");
const dotsContainer = document.getElementById("sliderDots");

const slides = track.querySelectorAll("img");
let current = 0;

slides.forEach((_, i) => {
const dot = document.createElement("div");
dot.classList.add("dot");
if(i === 0) dot.classList.add("active");
dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

function showSlide(index){
track.style.transform = `translateX(-${index * 100}%)`;

dots.forEach(dot => dot.classList.remove("active"));
dots[index].classList.add("active");
}

setInterval(() => {
current++;
if(current >= slides.length){
current = 0;
}
showSlide(current);
}, 5000);

function openMenu(){
document.getElementById("sideMenu").classList.add("active");
}

function closeMenu(){
document.getElementById("sideMenu").classList.remove("active");
}

// Laddu offer animation: run only while the section is on screen
const ladduScene = document.getElementById("ladduScene");

if (ladduScene && "IntersectionObserver" in window) {
ladduScene.classList.add("is-paused");
new IntersectionObserver(function(entries){
entries.forEach(function(entry){
ladduScene.classList.toggle("is-paused", !entry.isIntersecting);
});
}, { threshold: 0.25 }).observe(ladduScene);
}
  
</script>

</body>
